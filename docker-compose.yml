services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-certiflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-certiflow_pass}
      POSTGRES_DB: ${POSTGRES_DB:-certiflow_db}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_HOST_PORT:-5000}:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-certiflow_user}:${POSTGRES_PASSWORD:-certiflow_pass}@postgres:5432/${POSTGRES_DB:-certiflow_db}?schema=public}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-demo-only-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      CERTIFICATE_STORAGE_DIR: /app/storage/certificates
      BATCH_OVERDUE_HOURS: ${BATCH_OVERDUE_HOURS:-48}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      WHATSAPP_SIMULATED_FAILURE_RATE: ${WHATSAPP_SIMULATED_FAILURE_RATE:-0.2}
      WHATSAPP_SIMULATED_TIMEOUT_RATE: ${WHATSAPP_SIMULATED_TIMEOUT_RATE:-0.1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - certificates_data:/app/storage/certificates
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/health').then(r=>r.json()).then(b=>process.exit(b.status==='OK'?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  certificates_data:
